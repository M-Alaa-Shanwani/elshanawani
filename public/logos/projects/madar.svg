<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- التدرج اللوني الأساسي لحرف M -->
    <linearGradient id="madarMainGrad" x1="80" y1="380" x2="430" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B28CC" />
      <stop offset="50%" stop-color="#7B2CBF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <!-- تدرج المدار الأول -->
    <linearGradient id="orbitGrad1" x1="60" y1="420" x2="450" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7209B7" />
      <stop offset="50%" stop-color="#4361EE" />
      <stop offset="100%" stop-color="#4CC9F0" />
    </linearGradient>

    <!-- تدرج المدار الثاني -->
    <linearGradient id="orbitGrad2" x1="90" y1="100" x2="420" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>

    <!-- ظل ناعم لإبراز تداخل الطبقات -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00E5FF" flood-opacity="0.25" />
    </filter>

    <style>
      /* حركة طفو هادئة لحرف M في المركز */
      .m-core {
        animation: floatCore 4s ease-in-out infinite;
        transform-origin: center;
      }

      /* حركة تدفق الطاقة في المدارات */
      .orbit-flow-1 {
        stroke-dasharray: 850;
        stroke-dashoffset: 0;
        animation: pulseOrbit1 6s linear infinite;
      }

      .orbit-flow-2 {
        stroke-dasharray: 700 180;
        stroke-dashoffset: 0;
        animation: pulseOrbit2 8s linear infinite;
      }

      /* نبض العُقد المترابطة (Nodes) */
      .node-pulse-1 {
        animation: nodeGlow 2.5s ease-in-out infinite alternate;
        transform-origin: 322px 118px;
      }
      .node-pulse-2 {
        animation: nodeGlow 2.5s ease-in-out 0.8s infinite alternate;
        transform-origin: 298px 296px;
      }
      .node-pulse-3 {
        animation: nodeGlow 2.5s ease-in-out 1.5s infinite alternate;
        transform-origin: 132px 396px;
      }

      @keyframes floatCore {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.02); }
      }

      @keyframes pulseOrbit1 {
        0% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 160; }
        100% { stroke-dashoffset: 0; }
      }

      @keyframes pulseOrbit2 {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -880; }
      }

      @keyframes nodeGlow {
        0% { transform: scale(0.92); filter: brightness(0.95); }
        100% { transform: scale(1.18); filter: brightness(1.3); }
      }
    </style>
  </defs>

  <!-- المدار الخلفي الأول (مائل لليسار مع حركة تدفق) -->
  <ellipse class="orbit-flow-2" cx="256" cy="256" rx="210" ry="95" transform="rotate(38 256 256)" stroke="url(#orbitGrad2)" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- هيكل حرف M الانسيابي في المركز -->
  <path class="m-core" d="M156 340 V195 C156 168 190 158 206 180 L256 248 L306 180 C322 158 356 168 356 195 V340" stroke="url(#madarMainGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)" />

  <!-- المدار الأمامي المتقاطع (مائل لليمين) -->
  <ellipse class="orbit-flow-1" cx="256" cy="256" rx="215" ry="95" transform="rotate(-38 256 256)" stroke="url(#orbitGrad1)" stroke-width="18" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- عُقد الترابط المتحركة (System Modules Nodes) -->
  <!-- عقدة علوية يمين (Teal) -->
  <g class="node-pulse-1">
    <circle cx="322" cy="118" r="18" fill="#00E5FF" stroke="#1E1B4B" stroke-width="4" />
    <line x1="336" y1="128" x2="365" y2="146" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" />
    <circle cx="372" cy="150" r="11" fill="#00F5D4" />
  </g>

  <!-- عقدة وسطى تفاعلية -->
  <g class="node-pulse-2">
    <circle cx="298" cy="296" r="16" fill="#38BDF8" stroke="#1E1B4B" stroke-width="4" />
    <line x1="284" y1="286" x2="262" y2="270" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
    <circle cx="258" cy="267" r="9" fill="#6366F1" />
  </g>

  <!-- عقدة سفلية يسار (Purple) -->
  <circle class="node-pulse-3" cx="132" cy="396" r="18" fill="#9333EA" stroke="#1E1B4B" stroke-width="4" />

  <!-- عقدة سفلية يمين (Royal Blue) -->
  <circle cx="320" cy="404" r="13" fill="#3B82F6" />
</svg>
